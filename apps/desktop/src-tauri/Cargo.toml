[package]
name = "devatlas-desktop"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "devatlas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
devatlas-app-core = { path = "../../../crates/app-core" }
devatlas-ai-engine = { path = "../../../crates/ai-engine" }
devatlas-common = { path = "../../../crates/common" }
devatlas-scanner-engine = { path = "../../../crates/scanner-engine" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
