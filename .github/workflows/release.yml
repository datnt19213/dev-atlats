name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Build and Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sync version from release tag
        shell: powershell
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if ($tag -match '^v(.+)$') { $version = $Matches[1] } else { $version = $tag }
          $configPath = 'apps/desktop/src-tauri/tauri.conf.json'
          $tauri = Get-Content $configPath -Raw | ConvertFrom-Json
          $tauri.version = $version
          $tauri | ConvertTo-Json -Depth 10 | Set-Content $configPath

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop/src-tauri
          tauriScript: yarn tauri

      - name: Prepare release artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          # Sửa đúng path target ở root
          Copy-Item target/release/bundle/nsis/*.exe artifacts/ -ErrorAction Stop
          yarn release:checksums

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/checksums/sha256-checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
