name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Build and Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sync version from release tag
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if ($tag -match '^v(.+)$') { $version = $Matches[1] } else { $version = $tag }
          $tauri = Get-Content 'apps/desktop/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $tauri.version = $version
          $tauri | ConvertTo-Json -Depth 10 | Set-Content 'apps/desktop/src-tauri/tauri.conf.json'

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: yarn tauri build

      - name: Prepare release artifacts
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/nsis/*.exe artifacts/ || true

      - name: Generate checksums
        run: yarn release:checksums

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/checksums/sha256-checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
